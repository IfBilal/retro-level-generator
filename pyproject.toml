[project]
name = "text2mario"
version = "0.1.0"
description = "Text-conditioned discrete-tile diffusion for Super Mario Bros. levels"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests (deselect with -m 'not slow')"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
