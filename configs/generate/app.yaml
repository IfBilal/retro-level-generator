# Generation and app settings (CLAUDE.md rule 4: numbers live in configs).  Live-modification drills 1, 5, 7, 8, 9, 14, 18 edit this file.
window: 16            # model window width (fixed by the trained U-Net; do not change)
stride: 8             # columns the window advances; overlap = window - stride (drill 5: try 4, then check the seam ratio and the time)
cfg:
  default_w: 7.5      # frozen guidance scale (FROZEN.json)
  min_w: 1.0
  max_w: 10.0
widths: [16, 48, 80, 112]   # generated content columns offered in the app (drill 9: add 64 -> (64-16)/8+1 = 7 windows)
default_width: 48
modes:
  fast: {steps: 25, resample_r: 0, checker_budget: 1000}     # app default; forced without CUDA
  full: {steps: 50, resample_r: 2, checker_budget: 20000}    # drills 7 and 8: change steps / resample_r
verify: {max_window_attempts: 5, max_total_attempts: 20}      # ledger G5
validation: {max_prompt_chars: 400}
cloud: {time_budget_s: 45}                                    # drill 18: lower it to trigger the 'time budget' fallback
examples:                                                     # drill 14: add a chip
  - "full floor with two pipes and a few enemies"
  - "flat ground, one pipe, then several coins and a staircase"
  - "an underground level: three platforms, then a cannon and two enemies"
  - "mostly pits with two islands of ground, then a coin line"
# Prompt adherence (audit P2).  The model describes ONE 16-column window; a prompt describes the whole level.  So the level-level counts are
# planned across windows and the RAW result is verified with a deterministic counter (generate/adherence.py).  Nothing is edited: a miss is
# resampled, and if the budget runs out the UI says which counts were not met.
adherence:
  enabled: true          # false = old behaviour (every window of a scene gets the scene caption)
  plan: true             # per-window quantity planning
  verify: true           # resample windows until the raw level satisfies the parsed counts (or the budget ends)
  max_attempts: 16       # adherence resamples per level (the playability loop keeps its own max_total_attempts)
  max_extra_draws: 40    # hard cap on EXTRA window draws spent on counts per level (a seed that cannot be satisfied costs at most ~this many draws)
  batch_tries: 32        # CUDA: candidate windows drawn in ONE forward pass (measured 0.86 s for 32 vs 0.86 s for 1), the first exact (or closest) is kept; 1 = off
  batch_tries_cpu: 7     # CPU / Streamlit Cloud: one draw first; if it misses, this many more in one batch (measured 8 candidates ~2.5x one draw, sequential ~8x); 1 = off
  max_window_tries: 8    # a window is redrawn up to this many times until its NEW columns hold exactly what the plan asked for
  neutral_caption: "full floor."
  exclusive_scenes: true # 'X, then Y': what is asked for only in another scene must not appear in this one (strict ordering); false = only the asked counts are checked
  default_floor: "full floor"   # added to a window caption that has no floor phrase (measured to raise exact-count rates); "" = off
  range_target: mid      # a vague quantity ("several" = 5-9) is planned at its middle; the check still accepts the whole range
  max_new_per_window:    # most objects of a topic planned into the 8 NEW columns of one window
    pipe: 1        # measured per-window exact rate: 1 pipe ~55%, 2 pipes ~10-30%
    upside down pipe: 1
    enemy: 1       # measured per-window exact rate: 1 enemy ~30%, 'a few' 0% (it draws 4-10), so spread them one per window
    coin: 1
    coin line: 1
    cannon: 1
    platform: 1
    question block: 1
    ascending staircase: 1
    descending staircase: 1
    tower: 1
    rectangular block cluster: 1
    irregular block cluster: 1
    loose block: 1
  capacity_per_16_cols:  # a request above (this x width/16) cannot fit; it is rejected with a message instead of silently clamped
    pipe: 2
    enemy: 4
    coin: 12
    coin line: 2
    cannon: 2
    platform: 3
    question block: 3
    ascending staircase: 1
    descending staircase: 1
    tower: 2
    rectangular block cluster: 2
    irregular block cluster: 2
    loose block: 6
  count_as:              # which detector topics count towards a requested topic
    pipe: [pipe, upside down pipe, broken pipe]
